# ------------------------------------------------------------------
# Páginas de funcionalidades e LPs por profissão.
# Fonte única para: menu (mega menus e menu do celular), rodapé, hubs
# e cards de "Funcionalidades relacionadas".
#
# grupo:  hub | aluno | painel | servico | profissao
# status: ativo (padrão) | em-breve | acesso-antecipado
#   - em-breve / acesso-antecipado: mostra o selo no menu e nos cards,
#     e a página troca o "Começar grátis" pela lista de espera.
# icone:  nome do ícone Tabler (sem o "ti-"). Ícone novo precisa entrar
#         no assets/tabler-subset.woff2 (ver README).
# mockup: tela desenhada em HTML (arquivo em _includes/mock/), usada no topo
#         da página e no bloco "Do outro lado" da página espelho.
# ------------------------------------------------------------------

# Hubs
- id: funcionalidades
  mockup: combo
  grupo: hub
  nome: Funcionalidades
  url: /funcionalidades/
