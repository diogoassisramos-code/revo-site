name: Publicar no Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7 12 * * *"

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar e validar o site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build
          test -f _site/convite.html
          bash .github/scripts/checar-gtm.sh _site
      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Publicar revofit-site
        run: npx --yes firebase-tools@15.36.0 deploy --only hosting --project fit-app-f97b8 --non-interactive
