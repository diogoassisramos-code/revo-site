{%- comment -%}
  Dados estruturados: BreadcrumbList em todas as páginas novas; FAQPage quando há perguntas visíveis.
  pai = página-mãe (hub) opcional; atual = nome da página; faq = lista já filtrada.
{%- endcomment -%}
{%- assign faq = include.faq -%}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[
  {"@type":"ListItem","position":1,"name":"Revo","item":"{{ '/' | absolute_url }}"},
  {%- if include.pai %}
  {"@type":"ListItem","position":2,"name":{{ include.pai.nome | jsonify }},"item":"{{ include.pai.url | absolute_url }}"},
  {"@type":"ListItem","position":3,"name":{{ include.atual | jsonify }},"item":"{{ page.url | absolute_url }}"}
  {%- else %}
  {"@type":"ListItem","position":2,"name":{{ include.atual | jsonify }},"item":"{{ page.url | absolute_url }}"}
  {%- endif %}
]}
</script>
{%- if faq and faq.size > 0 %}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[
  {%- for f in faq %}
  {"@type":"Question","name":{{ f.p | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ f.r | markdownify | strip_html | strip | jsonify }}}}{% unless forloop.last %},{% endunless %}
  {%- endfor %}
]}
</script>
{%- endif %}
