name: Publicar artigos agendados

# Todo dia às 09:07 (Brasília) pede ao GitHub Pages para gerar o site de novo.
# Assim, posts com data futura em _posts/ entram no ar sozinhos no dia marcado.
on:
  schedule:
    - cron: "7 12 * * *"
  workflow_dispatch:

permissions:
  pages: write
  actions: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir novo build do GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      # O GitHub desativa workflows agendados em repositórios sem commits por 60 dias.
      # Como os artigos já estão todos no repo (só a data libera), pode passar 60 dias
      # sem commit. Reativar o próprio workflow todo dia evita que a publicação pare.
      - name: Manter o agendamento ativo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publicar-agendados.yml/enable"
